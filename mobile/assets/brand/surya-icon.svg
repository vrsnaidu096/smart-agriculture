<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Surya Kshetra icon">
  <defs>
    <radialGradient id="sun" cx="42%" cy="34%">
      <stop offset="0%" stop-color="#FFE0A0"/><stop offset="50%" stop-color="#E9A93C"/><stop offset="100%" stop-color="#BE7A20"/>
    </radialGradient>
    <!-- soft glow: fades to transparent, so no hard grey disc -->
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0%"  stop-color="#E9A93C" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#E9A93C" stop-opacity=".16"/>
      <stop offset="100%" stop-color="#E9A93C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26395F"/><stop offset="100%" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FB47A"/><stop offset="100%" stop-color="#1C5133"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="94"/></clipPath>
    <g id="rayB"><polygon points="100,4 108,48 92,48" fill="#E9A93C"/></g>
  </defs>

  <circle cx="100" cy="100" r="94" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <circle cx="100" cy="76" r="86" fill="url(#halo)"/>
    <g>
      <use href="#rayB" transform="rotate(0 100 76)"/><use href="#rayB" transform="rotate(45 100 76)"/>
      <use href="#rayB" transform="rotate(90 100 76)"/><use href="#rayB" transform="rotate(135 100 76)"/>
      <use href="#rayB" transform="rotate(180 100 76)"/><use href="#rayB" transform="rotate(225 100 76)"/>
      <use href="#rayB" transform="rotate(270 100 76)"/><use href="#rayB" transform="rotate(315 100 76)"/>
    </g>
    <circle cx="100" cy="76" r="37" fill="url(#sun)"/>
    <!-- horizon sits at the lower third; the sun rises from behind it -->
    <path d="M-10 210 Q 100 96 210 210 Z" fill="url(#field)"/>
    <path d="M-10 210 Q 100 96 210 210" stroke="#8FE0B0" stroke-width="3" fill="none" opacity=".55"/>
  </g>
</svg>
