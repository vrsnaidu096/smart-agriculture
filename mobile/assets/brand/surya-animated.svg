<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Surya Kshetra: a rising sun over a ploughed paddy field">
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes sway { 0%,100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes glow { 0%,100% { opacity: .8; } 50% { opacity: 1; } }
    .rays  { transform-origin: 100px 78px;  animation: spin 44s linear infinite; }
    .sun   { transform-origin: 100px 78px;  animation: rise 1.1s cubic-bezier(.2,.8,.3,1) both; }
    .stalk { transform-origin: 100px 192px; animation: sway 5.2s ease-in-out infinite; }
    .halo  { animation: glow 4.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .rays,.sun,.stalk,.halo { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="sun" cx="42%" cy="34%">
      <stop offset="0%" stop-color="#FFE0A0"/><stop offset="52%" stop-color="#E9A93C"/><stop offset="100%" stop-color="#BE7A20"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#E9A93C" stop-opacity=".38"/>
      <stop offset="55%"  stop-color="#E9A93C" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#E9A93C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26395F"/><stop offset="100%" stop-color="#0C1426"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FB47A"/><stop offset="100%" stop-color="#17462C"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="100" cy="100" r="92"/></clipPath>
    <!-- field shape reused as a clip so furrows can never cross the horizon -->
    <clipPath id="fieldClip"><path d="M-10 200 Q 100 64 210 200 Z"/></clipPath>
    <g id="rayL"><polygon points="100,16 105.5,52 94.5,52" fill="#E9A93C"/></g>
    <g id="rayS"><polygon points="100,30 103.6,54 96.4,54" fill="#E9A93C" opacity=".6"/></g>
  </defs>

  <circle cx="100" cy="100" r="92" fill="url(#sky)"/>
  <g clip-path="url(#disc)">
    <circle class="halo" cx="100" cy="78" r="82" fill="url(#halo)"/>
    <g class="rays">
      <use href="#rayL" transform="rotate(0 100 78)"/><use href="#rayS" transform="rotate(30 100 78)"/>
      <use href="#rayL" transform="rotate(60 100 78)"/><use href="#rayS" transform="rotate(90 100 78)"/>
      <use href="#rayL" transform="rotate(120 100 78)"/><use href="#rayS" transform="rotate(150 100 78)"/>
      <use href="#rayL" transform="rotate(180 100 78)"/><use href="#rayS" transform="rotate(210 100 78)"/>
      <use href="#rayL" transform="rotate(240 100 78)"/><use href="#rayS" transform="rotate(270 100 78)"/>
      <use href="#rayL" transform="rotate(300 100 78)"/><use href="#rayS" transform="rotate(330 100 78)"/>
    </g>
    <circle class="sun" cx="100" cy="78" r="30" fill="url(#sun)"/>

    <!-- field: control y=64 puts the true apex at y=132 -->
    <path d="M-10 200 Q 100 64 210 200 Z" fill="url(#field)"/>
    <g clip-path="url(#fieldClip)" stroke="#0F3A24" stroke-width="2.6" fill="none" opacity=".5" stroke-linecap="round">
      <path d="M6 208 Q 74 168 100 140"/>
      <path d="M52 208 Q 88 170 100 142"/>
      <path d="M148 208 Q 112 170 100 142"/>
      <path d="M194 208 Q 126 168 100 140"/>
    </g>
    <path d="M-10 200 Q 100 64 210 200" stroke="#8FE0B0" stroke-width="2.4" fill="none" opacity=".5"/>

    <!-- paddy panicle: slender angled grains up a stem, smallest at the tip -->
    <g class="stalk">
      <path d="M100 192 Q 99 168 101 146" stroke="#EFE7D5" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <ellipse cx="93.5" cy="176" rx="2.7" ry="8"   fill="#EFE7D5" transform="rotate(-34 93.5 176)"/>
      <ellipse cx="106.5" cy="176" rx="2.7" ry="8"  fill="#E3D7BC" transform="rotate(34 106.5 176)"/>
      <ellipse cx="94.5" cy="164" rx="2.5" ry="7.2" fill="#EFE7D5" transform="rotate(-30 94.5 164)"/>
      <ellipse cx="105.5" cy="164" rx="2.5" ry="7.2" fill="#E3D7BC" transform="rotate(30 105.5 164)"/>
      <ellipse cx="96" cy="153" rx="2.2" ry="6.2"   fill="#EFE7D5" transform="rotate(-26 96 153)"/>
      <ellipse cx="104" cy="153" rx="2.2" ry="6.2"  fill="#E3D7BC" transform="rotate(26 104 153)"/>
    </g>
  </g>
  <circle cx="100" cy="100" r="92" fill="none" stroke="#E9A93C" stroke-width="4"/>
</svg>
